name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ubuntu 24.04 · lint, test, generated files
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.12.19"

      - name: Install locked dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Smoke-test Python runtime dependencies
        run: make smoke-deps

      - name: Check generated files
        run: make gen && git diff --exit-code

  core-ubuntu-26:
    name: Ubuntu 26.04 · core tests and dependency smoke
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.12.19"

      - name: Install locked core dependencies
        run: |
          uv sync --project core --locked --no-install-project --no-build
          uv sync --project core --locked

      - name: Run core tests
        run: >-
          uv run --project core pytest -c core/pyproject.toml
          core/tests/unit core/tests/contract core/tests/golden

      - name: Smoke-test Python runtime dependencies
        run: uv run --project core python spikes/dependencies/smoke.py
