[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "svara-core"
version = "0.1.0"
description = "The shell-independent core for the Svara desktop assistant."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/svara_core"]
