[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "svara-core"
version = "0.1.0"
description = "The shell-independent core for the Svara desktop assistant."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "anthropic>=1.8,<1.9",
    "av>=18,<19",
    "claude-agent-sdk>=0.2,<0.3",
    "ctranslate2>=4.8,<4.9",
    "dbus-fast>=5,<6",
    "faster-whisper>=1.2,<1.3",
    "google-genai>=2,<3",
    "httpx>=0.28,<0.29",
    "keyring>=25,<26",
    "mcp>=2,<3",
    "numpy>=2.5,<2.6",
    "onnxruntime>=1.30,<1.31",
    "openai>=3,<4",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
    "starlette>=1.7,<1.8",
    "tokenizers>=0.23,<0.24",
    "uvicorn>=0.54,<0.55",
    "watchfiles>=1.3,<1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/svara_core"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pyright>=1.1.410,<1.1.420",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests/unit", "tests/contract", "tests/golden"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "BLE", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
strict = [
    "src/svara_core/config",
    "src/svara_core/kernel",
    "src/svara_core/protocol",
    "src/svara_core/tools",
]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
