[package]
name = "svara-tauri-spike"
version = "0.1.0"
description = "Tauri shell spike for Svara"
authors = ["Svara contributors"]
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
cairo-rs = "0.18"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.11.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
